<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Curriculum</title>
<link rel="stylesheet" href="style.css">
<script src="common.js"></script>
<script src="curriculum-data.js"></script>
</head>
<body>
<a href="index.html">← Home</a>
<div id="view"></div>
<script>
const box = document.getElementById("view");

function render() {
  const p = location.hash.slice(1).split("-");
  const lv = parseInt(p[0]) - 1, ls = parseInt(p[1]) - 1;
  if (!(lv >= 0 && lv < CURRICULUM.length)) return showLevels();
  if (!(ls >= 0 && ls < CURRICULUM[lv].lessons.length)) return showLessons(lv);
  showLesson(lv, ls);
}

function showLevels() {
  let h = "<h1>Curriculum</h1>";
  CURRICULUM.forEach((l, i) => {
    const n = l.lessons.length;
    h += n
      ? '<a class="big" href="#' + (i + 1) + '"><b>' + l.title + "</b><br>" + n + (n > 1 ? " lessons" : " lesson") + "</a>"
      : '<div class="big off"><b>' + l.title + "</b><br>Coming soon</div>";
  });
  box.innerHTML = h;
}

function showLessons(lv) {
  const L = CURRICULUM[lv];
  let h = '<p><a href="#">← All levels</a></p><h1>' + L.title + "</h1>";
  L.lessons.forEach((les, k) => {
    h += '<a class="big" href="#' + (lv + 1) + "-" + (k + 1) + '">' + les.title + "</a>";
  });
  box.innerHTML = h;
}

function showLesson(lv, ls) {
  const L = CURRICULUM[lv];
  const les = L.lessons[ls];
  let h = '<p><a href="#' + (lv + 1) + '">← ' + L.title + "</a></p>";
  h += "<h2>" + les.title + "</h2><div>" + les.content + "</div><h3>Exercises</h3><p id='score'></p>";
  les.exercises.forEach((e, n) => {
    h += '<div class="ex" data-n="' + n + '"><p>' + (n + 1) + ". " + e.q + "</p>";
    if (e.type === "mc") {
      e.options.forEach((o, k) => { h += '<button class="opt" data-k="' + k + '">' + o + "</button>"; });
    } else {
      h += '<input class="ans" placeholder="Your answer"><button class="chk">Check</button>';
    }
    h += '<p class="fb"></p></div>';
  });
  h += ls < L.lessons.length - 1
    ? '<p><a class="pill" href="#' + (lv + 1) + "-" + (ls + 2) + '">Next lesson →</a></p>'
    : '<p><a class="pill" href="#' + (lv + 1) + '">Back to ' + L.title + "</a></p>";
  box.innerHTML = h;
  applyCop(box);

  let right = 0, answered = 0;
  const total = les.exercises.length;
  const score = document.getElementById("score");
  score.textContent = "Score: 0 / " + total;

  box.querySelectorAll(".ex").forEach(div => {
    const e = les.exercises[div.dataset.n];
    const fb = div.querySelector(".fb");
    function finish(ok) {
      if (div.dataset.done) return;
      div.dataset.done = 1;
      answered++;
      if (ok) right++;
      fb.textContent = ok ? "✅ Correct" : "❌ " + (e.explain || "Not quite.");
      score.textContent = "Score: " + right + " / " + total + (answered === total ? " (done)" : "");
    }
    if (e.type === "mc") {
      const btns = div.querySelectorAll(".opt");
      btns.forEach(b => b.onclick = () => {
        if (div.dataset.done) return;
        const k = +b.dataset.k;
        btns[e.answer].classList.add("good");
        if (k !== e.answer) b.classList.add("bad");
        finish(k === e.answer);
      });
    } else {
      div.querySelector(".chk").onclick = () => {
        const v = div.querySelector(".ans").value.trim().toLowerCase();
        finish(e.answer.some(a => a.toLowerCase() === v));
      };
    }
  });
}

window.onhashchange = render;
render();
</script>
</body>
</html>
